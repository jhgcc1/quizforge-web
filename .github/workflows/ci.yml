name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint (ESLint, typescript-eslint recommended rules)
        run: pnpm lint
      - name: Unit and component tests with coverage (fails below the thresholds)
        run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          { echo '### Coverage'; echo '```'; cat coverage/summary.txt 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: coverage/, retention-days: 14, if-no-files-found: ignore }

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Next.js production build
        run: AUTH_MODE=local APP_URL=http://localhost:13000 pnpm build

  # The back end is a separate repository and production runs the main of both: this is the only place where a front end
  # change is tried against the back end it will actually meet. The Playwright suite lives in the back end repository
  # (e2e/), which expects the front end checked out into web/ -- so this job checks out jhgcc1/quizforge main, puts THIS
  # commit inside it, and runs that suite. No model key is needed: the worker runs with LLM_MODE=fake.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the back end (jhgcc1/quizforge at main)
        uses: actions/checkout@v4
        with:
          repository: jhgcc1/quizforge
          ref: main
          path: backend
      - name: Check out this front end into backend/web
        uses: actions/checkout@v4
        with: { path: backend/web }
      - name: Say which pair this ran
        run: |
          echo "front end \`$(git -C backend/web rev-parse --short HEAD)\` (this change) against back end \`$(git -C backend rev-parse --short HEAD)\` (main)" >> "$GITHUB_STEP_SUMMARY"
      # both checkouts are in subdirectories, so the action is told where the package.json with packageManager is
      - uses: pnpm/action-setup@v4
        with: { package_json_file: backend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm, cache-dependency-path: backend/pnpm-lock.yaml }
      - name: Install the back end workspace
        working-directory: backend
        run: pnpm install --frozen-lockfile
      - name: Start Postgres and the SQS emulator
        working-directory: backend
        run: |
          docker compose up -d postgres elasticmq
          for i in $(seq 1 40); do docker compose ps postgres --format '{{.Health}}' | grep -q healthy && break; sleep 2; done
          for i in $(seq 1 30); do curl -sf "http://localhost:9324/?Action=ListQueues" >/dev/null && break; sleep 2; done
      - name: Install Chromium
        working-directory: backend
        run: pnpm exec playwright install --with-deps chromium
      - name: Install and build this front end
        working-directory: backend/web
        run: |
          pnpm install --ignore-workspace --frozen-lockfile
          pnpm build
        env: { AUTH_MODE: local, APP_URL: "http://localhost:13000" }
      - name: Playwright (login -> generate -> answer -> reload -> submit -> score)
        working-directory: backend
        run: pnpm test:e2e
        env: { CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            backend/playwright-report
            backend/test-results
          retention-days: 7

  docker-build:
    name: docker-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t quizforge-web:ci .
      - name: "Trivy (fails on fixable HIGH or CRITICAL findings)"
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.58.1 image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --ignorefile /.trivyignore quizforge-web:ci

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --verbose

  # Publish the web image to ECR (main only, after every gate). It deploys NOTHING: the role can only push to ECR; the infra repository
  # (jhgcc1/quizforge-infra, workflow Deploy, input web_tag) decides when it goes to production.
  publish:
    name: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, build, e2e, docker-build, secrets-scan]
    runs-on: ubuntu-24.04-arm # native arm64 image for Graviton Fargate
    timeout-minutes: 30
    concurrency: { group: publish-image, cancel-in-progress: false }
    permissions:
      id-token: write # OIDC: the ECR push-only role quizforge-gha-publish (trusts refs/heads/main of this repository)
      contents: read
    env:
      WEB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
      - name: "Build and push quizforge/web:web-<first 12 characters of the commit> (immutable; an existing tag is skipped)"
        run: |
          tag="web-$(cut -c1-12 <<< "$WEB_SHA")"
          if aws ecr describe-images --repository-name quizforge/web --image-ids imageTag="$tag" >/dev/null 2>&1; then
            echo "web:$tag already in ECR, skipping"
          else
            docker buildx build -f Dockerfile -t "${{ steps.ecr.outputs.registry }}/quizforge/web:$tag" --push \
              --cache-from type=gha,scope=web-arm --cache-to type=gha,scope=web-arm,mode=max .
          fi
          echo "### Published \`quizforge/web:$tag\` to ECR. Deploy it from jhgcc1/quizforge-infra (workflow Deploy, web_tag=$tag)." >> "$GITHUB_STEP_SUMMARY"
